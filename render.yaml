services:
  # =========================================================================
  # 1. Backend Web Service (.NET 10 ASP.NET Core API via Docker)
  # =========================================================================
  - type: web
    name: bloodbankmanagementsysytem
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Key
        generateValue: true

  # =========================================================================
  # 2. Frontend Static Site (Angular 19 SPA)
  # =========================================================================
  - type: web
    name: bloodbank-frontend
    runtime: static
    rootDir: frontend/blood-bank-client
    buildCommand: npm install && npm run build
    staticPublishPath: dist/blood-bank-client/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
